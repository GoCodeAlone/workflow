  exact-candidate-runtime:
    needs: exact-candidate-acquisition
    if: needs.exact-candidate-acquisition.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.exact_candidate_runtime_proof == true && inputs.osv_production_proof == false && inputs.osv_container_proof == false && github.ref == 'refs/heads/prep/osv-prerequisites-20261011-r1' && github.repository == 'GoCodeAlone/workflow' && github.run_attempt == 1 && inputs.osv_docker_parent_headroom_proof == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions: {}
    env:
      OSV_RUNTIME_SOURCE_REVIEW: ${{ inputs.exact_candidate_source_review_json }}
      OSV_RUNTIME_SOURCE_REVIEW_SHA: ${{ inputs.exact_candidate_source_review_sha256 }}
      OSV_CANDIDATE_TRIAL: ${{ inputs.exact_candidate_trial_json }}
      OSV_CANDIDATE_TRIAL_SHA: ${{ inputs.exact_candidate_trial_sha256 }}
      OSV_PRODUCER_OUTCOME: ${{ needs.exact-candidate-acquisition.result }}
      OSV_CARRIER_ID: ${{ needs.exact-candidate-acquisition.outputs.carrier_id }}
      OSV_CARRIER_DIGEST: ${{ needs.exact-candidate-acquisition.outputs.carrier_digest }}
      OSV_PRODUCER_RECEIPT_SHA: ${{ needs.exact-candidate-acquisition.outputs.receipt_sha256 }}
      OSV_INVOCATION_ID: ${{ needs.exact-candidate-acquisition.outputs.invocation_id }}
    steps:
      - name: Retrieve only the successful producer's same-run artifact ID
        id: carrier
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.exact-candidate-acquisition.outputs.carrier_id }}
          merge-multiple: true
          digest-mismatch: error
          path: ${{ runner.temp }}/candidate9819-carrier
      - name: Cold full carrier guard and exact executable receiver
        id: receiver
        continue-on-error: true
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP}/candidate9819-carrier"
          wrapper="$root/bundle/scripts/osv-offline/exact-candidate-runtime/split-hosted.py"
          actual="$(/usr/bin/sha256sum "$wrapper")"
          test "${actual%% *}" = de09495665fdd24b21beb59bc538e0a3ea81dd0233e8091530b8364059e87fa3
          export OSV_PROOF_ROOT="${RUNNER_TEMP}/candidate9819-proof-${GITHUB_RUN_ID}-1"
          startup_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/candidate9819-startup-XXXXXXXXXX")"
          /usr/bin/timeout --signal=TERM --kill-after=5s 35s /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C LC_ALL=C HOME=/nonexistent RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            OSV_RUNTIME_SOURCE_REVIEW="$OSV_RUNTIME_SOURCE_REVIEW" \
            OSV_RUNTIME_SOURCE_REVIEW_SHA="$OSV_RUNTIME_SOURCE_REVIEW_SHA" \
            OSV_CANDIDATE_TRIAL="$OSV_CANDIDATE_TRIAL" OSV_CANDIDATE_TRIAL_SHA="$OSV_CANDIDATE_TRIAL_SHA" \
            OSV_PRODUCER_OUTCOME="$OSV_PRODUCER_OUTCOME" OSV_CARRIER_ID="$OSV_CARRIER_ID" OSV_CARRIER_DIGEST="$OSV_CARRIER_DIGEST" OSV_PRODUCER_RECEIPT_SHA="$OSV_PRODUCER_RECEIPT_SHA" OSV_INVOCATION_ID="$OSV_INVOCATION_ID" OSV_PROOF_ROOT="$OSV_PROOF_ROOT" \
            /usr/bin/python3 -I -S -B -X "pycache_prefix=$startup_dir/absent-cache" \
            "$wrapper" receive "$root" --execute
      - name: Supply only the unchanged approved Python image
        id: image
        if: steps.receiver.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          /usr/bin/timeout --signal=TERM --kill-after=10s 120s /usr/bin/env -i             PATH=/usr/bin:/bin HOME=/nonexistent LANG=C LC_ALL=C             /usr/bin/docker pull docker.io/library/python@sha256:f040863673aea2570c3ff6a5c3fb4c673a016cbc5375005ad145915922b6b78a
      - name: Actual native controls then exact candidate schema
        id: runtime
        if: steps.receiver.outcome == 'success' && steps.image.outcome == 'success'
        continue-on-error: true
        env:
          OSV_RECEIVER_OUTCOME: ${{ steps.receiver.outcome }}
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP}/candidate9819-carrier"
          wrapper="$root/bundle/scripts/osv-offline/exact-candidate-runtime/split-hosted.py"
          actual="$(/usr/bin/sha256sum "$wrapper")"
          test "${actual%% *}" = de09495665fdd24b21beb59bc538e0a3ea81dd0233e8091530b8364059e87fa3
          export OSV_PROOF_ROOT="${RUNNER_TEMP}/candidate9819-proof-${GITHUB_RUN_ID}-1"
          startup_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/candidate9819-startup-XXXXXXXXXX")"
          /usr/bin/timeout --signal=TERM --kill-after=5s 90s /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C LC_ALL=C HOME=/nonexistent RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            OSV_RUNTIME_SOURCE_REVIEW="$OSV_RUNTIME_SOURCE_REVIEW" \
            OSV_RUNTIME_SOURCE_REVIEW_SHA="$OSV_RUNTIME_SOURCE_REVIEW_SHA" \
            OSV_CANDIDATE_TRIAL="$OSV_CANDIDATE_TRIAL" OSV_CANDIDATE_TRIAL_SHA="$OSV_CANDIDATE_TRIAL_SHA" \
            OSV_PRODUCER_OUTCOME="$OSV_PRODUCER_OUTCOME" OSV_CARRIER_ID="$OSV_CARRIER_ID" OSV_CARRIER_DIGEST="$OSV_CARRIER_DIGEST" OSV_PRODUCER_RECEIPT_SHA="$OSV_PRODUCER_RECEIPT_SHA" OSV_INVOCATION_ID="$OSV_INVOCATION_ID" OSV_PROOF_ROOT="$OSV_PROOF_ROOT" OSV_RECEIVER_OUTCOME="$OSV_RECEIVER_OUTCOME" \
            /usr/bin/python3 -I -S -B -X "pycache_prefix=$startup_dir/absent-cache" \
            "$wrapper" runtime "$root" --execute
      - name: One-day receipts and bounded schema output only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate9819-schema-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate9819-carrier/*-failure.json
            ${{ runner.temp }}/candidate9819-proof-${{ github.run_id }}-1/*.json
            ${{ runner.temp }}/candidate9819-proof-${{ github.run_id }}-1/receiver/receiver-proof.json
            ${{ runner.temp }}/candidate9819-proof-${{ github.run_id }}-1/runtime/controller-*.json
            ${{ runner.temp }}/candidate9819-proof-${{ github.run_id }}-1/runtime/container-ownership.json*
            ${{ runner.temp }}/candidate9819-proof-${{ github.run_id }}-1/runtime/container/request.json
            ${{ runner.temp }}/candidate9819-proof-${{ github.run_id }}-1/runtime/container/worker-*.json
            ${{ runner.temp }}/candidate9819-proof-${{ github.run_id }}-1/runtime/container/native-controls.json
            ${{ runner.temp }}/candidate9819-proof-${{ github.run_id }}-1/runtime/container/native-control-*.json
            ${{ runner.temp }}/candidate9819-proof-${{ github.run_id }}-1/runtime/container/candidate.stdout
            ${{ runner.temp }}/candidate9819-proof-${{ github.run_id }}-1/runtime/container/candidate.stderr
          if-no-files-found: warn
          retention-days: 1
          overwrite: false
      - name: Enforce actual runtime job outcome
        if: ${{ !cancelled() }}
        env:
          RECEIVER: ${{ steps.receiver.outcome }}
          IMAGE: ${{ steps.image.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
        run: |
          set -euo pipefail
          test "$RECEIVER" = success
          test "$IMAGE" = success
          test "$RUNTIME" = success

  osv-docker-parent-headroom:
    if: github.event_name == 'workflow_dispatch' && inputs.osv_docker_parent_headroom_proof == true && inputs.osv_container_proof == false && inputs.osv_production_proof == false && inputs.exact_candidate_runtime_proof == false && github.ref == 'refs/heads/prep/osv-prerequisites-20261011-r1' && github.repository == 'GoCodeAlone/workflow' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the exact reviewed measurement source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Supply the existing pinned Python container
        run: |
          set -euo pipefail
          /usr/bin/timeout --signal=TERM --kill-after=10s 120s /usr/bin/env -i \
            PATH=/usr/bin:/bin HOME=/nonexistent LANG=C LC_ALL=C \
            /usr/bin/docker pull docker.io/library/python@sha256:f040863673aea2570c3ff6a5c3fb4c673a016cbc5375005ad145915922b6b78a
      - name: Observe the owned Docker init parent headroom without scanning
        id: headroom
        continue-on-error: true
        run: |
          set -euo pipefail
          umask 077
          actual="$(/usr/bin/sha256sum scripts/osv-offline/docker-headroom-manifest.json)"
          test "${actual%% *}" = 1046ef09bbf46366d7a74a5f9f67b13fff09d5676eb8313d5e73d312236c864b
          actual="$(/usr/bin/sha256sum scripts/osv-offline/run-docker-headroom-proof.py)"
          test "${actual%% *}" = 53ac30b4bc40bf33041e0064500a25b4cc8b78048a1a819786f153035673cb4d
          proof_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/osv-headroom-XXXXXXXXXX")"
          startup_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/osv-headroom-startup-XXXXXXXXXX")"
          printf 'evidence=%s\n' "$proof_dir" >> "$GITHUB_OUTPUT"
          /usr/bin/timeout --signal=TERM --kill-after=10s 210s /usr/bin/env -i \
            PATH=/usr/bin:/bin HOME=/nonexistent LANG=C LC_ALL=C RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            /usr/bin/python3 -I -S -B -X "pycache_prefix=$startup_dir/absent-cache" \
            scripts/osv-offline/run-docker-headroom-proof.py "$proof_dir" --execute
      - name: Retain actual headroom and full-ID retirement evidence
        if: ${{ !cancelled() && steps.headroom.outputs.evidence != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: osv-docker-parent-headroom-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.headroom.outputs.evidence }}
          if-no-files-found: error
          retention-days: 5
      - name: Enforce actual observation and retirement
        if: ${{ !cancelled() }}
        run: test '${{ steps.headroom.outcome }}' = success
