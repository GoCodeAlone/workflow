name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
    inputs:
      osv_privileged_proof:
        description: 'Run the separately authorized ephemeral systemd prerequisite proof'
        type: boolean
        required: false
        default: false
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

defaults:
  run:
    shell: bash

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    if: github.ref != 'refs/heads/prep/osv-prerequisites-20261011-r1'
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission. If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Setup Go environment for development and testing
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
          cache-dependency-path: go.sum

      # Setup Docker for containerized development
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      # Install Go dependencies and development tools
      - name: Install Go dependencies and tools
        run: |
          go mod download
          go mod verify

      # Install golangci-lint for Go code linting
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        continue-on-error: true
        with:
          version: latest

      # Verify all tools are properly installed
      - name: Verify tool installations
        run: |
          echo "=== Tool Versions ==="
          go version
          golangci-lint version
          echo "All tools installed successfully!"

  # Temporary, separately reviewed prerequisite-only execution on an owned ref.
  # Main workflows, required checks and the legacy OSV workflow are unchanged.
  osv-runtime-prerequisite:
    if: github.event_name == 'workflow_dispatch' && inputs.osv_privileged_proof == true && github.ref == 'refs/heads/prep/osv-prerequisites-20261011-r1' && github.repository == 'GoCodeAlone/workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out the exact reviewed proof commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Supply authenticated Ubuntu bubblewrap in temporary private storage
        id: supplier
        continue-on-error: true
        run: |
          set -euo pipefail
          umask 077
          actual="$(/usr/bin/sha256sum scripts/osv-offline/supply-bubblewrap.py)"
          test "${actual%% *}" = 72d3b656c61ba966c13bae1c5ff09405f88f378bbe2e64116a49c87832592183
          supplier_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/osv-ubuntu-bubblewrap-XXXXXXXXXX")"
          startup_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/osv-supplier-startup-XXXXXXXXXX")"
          printf 'evidence=%s\n' "$supplier_dir" >> "$GITHUB_OUTPUT"
          /usr/bin/timeout --signal=TERM --kill-after=10s 210s /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C LC_ALL=C RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_JOB="$GITHUB_JOB" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            ImageOS="${ImageOS-}" ImageVersion="${ImageVersion-}" \
            /usr/bin/python3 -I -S -B -X "pycache_prefix=$startup_dir/absent-cache" \
            scripts/osv-offline/supply-bubblewrap.py "$supplier_dir"
      - name: Probe the reviewed boundary in one bounded delegated transient service
        if: steps.supplier.outcome == 'success'
        id: proof
        continue-on-error: true
        env:
          BUBBLEWRAP_SUPPLIER_DIR: ${{ steps.supplier.outputs.evidence }}
        run: |
          set -euo pipefail
          umask 077
          actual="$(/usr/bin/sha256sum scripts/osv-offline/run-systemd-proof.py)"
          test "${actual%% *}" = 4ea996697b23c8ae63eeb13251f401c344ae4694b17221e8388866cae788c2d9
          proof_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/osv-prerequisite-XXXXXXXXXX")"
          startup_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/osv-prerequisite-startup-XXXXXXXXXX")"
          printf 'evidence=%s\n' "$proof_dir" >> "$GITHUB_OUTPUT"
          /usr/bin/timeout --signal=TERM --kill-after=10s 240s /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C LC_ALL=C RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_REF="$GITHUB_REF" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_JOB="$GITHUB_JOB" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            ImageOS="${ImageOS-}" ImageVersion="${ImageVersion-}" \
            /usr/bin/python3 -I -S -B -X "pycache_prefix=$startup_dir/absent-cache" \
            scripts/osv-offline/run-systemd-proof.py "$proof_dir" --execute \
            --bubblewrap "$BUBBLEWRAP_SUPPLIER_DIR/bwrap" \
            --supplier-receipt "$BUBBLEWRAP_SUPPLIER_DIR/bubblewrap-supplier-receipt.json"
      - name: Retain bounded official-package prerequisite evidence
        if: ${{ !cancelled() && steps.supplier.outputs.evidence != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: osv-bubblewrap-prerequisite-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.supplier.outputs.evidence }}
          if-no-files-found: error
          retention-days: 5
      - name: Retain bounded authentic prerequisite evidence
        if: ${{ !cancelled() && steps.proof.outputs.evidence != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: osv-runtime-prerequisite-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.proof.outputs.evidence }}
          if-no-files-found: error
          retention-days: 5
      - name: Enforce the actual prerequisite result
        if: ${{ !cancelled() }}
        run: |
          test '${{ steps.supplier.outcome }}' = success
          test '${{ steps.proof.outcome }}' = success
