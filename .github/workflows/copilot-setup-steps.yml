name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
    inputs:
      osv_docker_parent_headroom_proof:
        description: 'Run only the fixed2GiB Python Docker-parent headroom observation'
        type: boolean
        required: false
        default: false
      osv_container_proof:
        description: 'Run the approved pinned container boundary proof on the disposable runner'
        type: boolean
        required: false
        default: false
      osv_production_proof:
        description: 'Collect approved finite supplier, production container and readonly fixture evidence'
        type: boolean
        required: false
        default: false
      exact_candidate_runtime_proof:
        description: 'Run the approved exact existing candidate controls and schema witness'
        type: boolean
        required: false
        default: false
      exact_candidate_source_review_json:
        description: 'Exact current independent source-review admission JSON'
        type: string
        required: false
        default: ''
      exact_candidate_source_review_sha256:
        description: 'SHA256 of the exact source-review admission JSON bytes'
        type: string
        required: false
        default: ''
      exact_candidate_trial_json:
        description: 'Root-issued single-dispatch trial with explicit UTC window and source/ledger pins'
        type: string
        required: false
        default: ''
      exact_candidate_trial_sha256:
        description: 'SHA256 of the exact root-issued trial JSON bytes'
        type: string
        required: false
        default: ''
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

defaults:
  run:
    shell: bash

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    if: github.ref != 'refs/heads/prep/osv-prerequisites-20261011-r1' && !(github.event_name == 'workflow_dispatch' && inputs.osv_docker_parent_headroom_proof == true)
    runs-on: ubuntu-latest

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      # If you want to clone the repository as part of your setup steps, for example to install dependencies, you'll need the `contents: read` permission. If you don't clone the repository in your setup steps, Copilot will do this for you automatically after the steps complete.
      contents: read

    # You can define any steps you want, and they will run before the agent starts.
    # If you do not check out your code, Copilot will do this for you.
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Setup Go environment for development and testing
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
          cache-dependency-path: go.sum

      # Setup Docker for containerized development
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      # Install Go dependencies and development tools
      - name: Install Go dependencies and tools
        run: |
          go mod download
          go mod verify

      # Install golangci-lint for Go code linting
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        continue-on-error: true
        with:
          version: latest

      # Verify all tools are properly installed
      - name: Verify tool installations
        run: |
          echo "=== Tool Versions ==="
          go version
          golangci-lint version
          echo "All tools installed successfully!"

  # Separately approved proof on the owned ref; no legacy namespace retry.
  osv-container-prerequisite:
    if: github.event_name == 'workflow_dispatch' && inputs.osv_container_proof == true && github.ref == 'refs/heads/prep/osv-prerequisites-20261011-r1' && github.repository == 'GoCodeAlone/workflow' && inputs.osv_docker_parent_headroom_proof == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out the exact reviewed proof commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Supply the exact official analysis compiler
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.27.2'
          cache: false
      - name: Supply the pinned official Python container
        run: |
          set -euo pipefail
          /usr/bin/timeout --signal=TERM --kill-after=10s 120s /usr/bin/env -i \
            PATH=/usr/bin:/bin HOME=/nonexistent LANG=C LC_ALL=C \
            /usr/bin/docker pull docker.io/library/python@sha256:f040863673aea2570c3ff6a5c3fb4c673a016cbc5375005ad145915922b6b78a
      - name: Prove the approved aggregate container boundary
        id: proof
        continue-on-error: true
        run: |
          set -euo pipefail
          umask 077
          actual="$(/usr/bin/sha256sum scripts/osv-offline/container-source-bindings.json)"
          test "${actual%% *}" = 682cb359fcfce48b1a209c1f04cbb805f4779578dcb8146fe1a9caa8fbfad8f8
          actual="$(/usr/bin/sha256sum scripts/osv-offline/run-container-proof.py)"
          test "${actual%% *}" = c4db39f78f0555396dde81a444d88f73ea7d95dca0090d61e4bbe6545b7ec4a5
          proof_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/osv-container-proof-XXXXXXXXXX")"
          startup_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/osv-container-startup-XXXXXXXXXX")"
          printf 'evidence=%s\n' "$proof_dir" >> "$GITHUB_OUTPUT"
          compiler_root="$(/usr/bin/dirname "$(/usr/bin/dirname "$(command -v go)")")"
          /usr/bin/timeout --signal=TERM --kill-after=10s 210s /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C LC_ALL=C RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_JOB="$GITHUB_JOB" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            /usr/bin/python3 -I -S -B -X "pycache_prefix=$startup_dir/absent-cache" \
            scripts/osv-offline/run-container-proof.py "$proof_dir" "$compiler_root" --execute
      - name: Retain actual container boundary evidence
        if: ${{ !cancelled() && steps.proof.outputs.evidence != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: osv-container-prerequisite-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.proof.outputs.evidence }}
          if-no-files-found: error
          retention-days: 5
      - name: Enforce the actual proof outcome
        if: ${{ !cancelled() }}
        run: test '${{ steps.proof.outcome }}' = success

  osv-production-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.osv_production_proof == true && inputs.osv_container_proof == false && github.ref == 'refs/heads/prep/osv-prerequisites-20261011-r1' && github.repository == 'GoCodeAlone/workflow' && inputs.osv_docker_parent_headroom_proof == false
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - name: Check out the exact finite proof implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Supply the fixed public source objects
        run: |
          set -euo pipefail
          /usr/bin/timeout --signal=TERM --kill-after=10s 120s /usr/bin/env -i \
            PATH=/usr/bin:/bin HOME=/nonexistent LANG=C LC_ALL=C \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 \
            /usr/bin/git fetch --no-tags --no-recurse-submodules https://github.com/GoCodeAlone/workflow.git \
              81b9b1df2386f7d44c8464c999a4ea0919813526 2fcb9baf4f03d599efb1fc4c462455a978620ae4
      - name: Supply the exact analysis compiler
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.27.2'
          cache: false
      - name: Supply the pinned Python container
        run: |
          set -euo pipefail
          /usr/bin/timeout --signal=TERM --kill-after=10s 120s /usr/bin/env -i \
            PATH=/usr/bin:/bin HOME=/nonexistent LANG=C LC_ALL=C \
            /usr/bin/docker pull docker.io/library/python@sha256:f040863673aea2570c3ff6a5c3fb4c673a016cbc5375005ad145915922b6b78a
      - name: Build the authenticated fixed suppliers serially
        id: supplier
        continue-on-error: true
        run: |
          set -euo pipefail
          umask 077
          actual="$(/usr/bin/sha256sum scripts/osv-offline/prepare-supplier.py)"
          test "${actual%% *}" = 7f729027a8b2dd299ae64dbfe7028cc58b9590b55ae30d58b6d473947e35cf0b
          compiler="$(command -v go)"
          compiler_root="$(/usr/bin/dirname "$(/usr/bin/dirname "$compiler")")"
          mapfile -t caches < <(/usr/bin/env -i PATH="$compiler_root/bin:/usr/bin:/bin" HOME="$HOME" \
            GOENV=off GOWORK=off GOTOOLCHAIN=local "$compiler" env GOPATH GOMODCACHE GOCACHE)
          test "${#caches[@]}" = 3
          # These are the standard allocated runner caches; no private Go cache.
          /usr/bin/mkdir -p -- "${caches[@]}"
          supplier_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/osv-supplier-XXXXXXXXXX")"
          startup_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/osv-supplier-startup-XXXXXXXXXX")"
          printf 'evidence=%s\ncompiler-root=%s\ngopath=%s\nmodule-cache=%s\nbuild-cache=%s\n' \
            "$supplier_dir" "$compiler_root" "${caches[0]}" "${caches[1]}" "${caches[2]}" >> "$GITHUB_OUTPUT"
          /usr/bin/timeout --signal=TERM --kill-after=10s 1830s /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C LC_ALL=C HOME=/nonexistent RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" \
            /usr/bin/python3 -I -S -B -X "pycache_prefix=$startup_dir/absent-cache" \
            scripts/osv-offline/prepare-supplier.py --execute --output "$supplier_dir" --go "$compiler" \
              --gopath "${caches[0]}" --gomodcache "${caches[1]}" --gocache "${caches[2]}"
      - name: Collect actual finite production executions
        id: production
        if: steps.supplier.outcome == 'success'
        continue-on-error: true
        env:
          SUPPLIER_DIRECTORY: ${{ steps.supplier.outputs.evidence }}
          COMPILER_ROOT: ${{ steps.supplier.outputs.compiler-root }}
          ALLOCATED_GOPATH: ${{ steps.supplier.outputs.gopath }}
          ALLOCATED_MODULE_CACHE: ${{ steps.supplier.outputs.module-cache }}
          ALLOCATED_BUILD_CACHE: ${{ steps.supplier.outputs.build-cache }}
        run: |
          set -euo pipefail
          umask 077
          actual="$(/usr/bin/sha256sum scripts/osv-offline/bootstrap-manifest.json)"
          test "${actual%% *}" = 8638b703c9b81e4511be3954c9c5f7996507d28d1d7a2b438c4cd9c7f592e276
          actual="$(/usr/bin/sha256sum scripts/osv-offline/run-production-proof.py)"
          test "${actual%% *}" = bcfc2c4e30fb988281244333ca3504a5e498bface54db3e9df75e310856b04d0
          proof_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/osv-production-XXXXXXXXXX")"
          startup_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/osv-production-startup-XXXXXXXXXX")"
          printf 'evidence=%s\n' "$proof_dir" >> "$GITHUB_OUTPUT"
          /usr/bin/timeout --signal=TERM --kill-after=10s 5430s /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C LC_ALL=C HOME=/nonexistent RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" \
            GITHUB_OUTPUT="$GITHUB_OUTPUT" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            /usr/bin/python3 -I -S -B -X "pycache_prefix=$startup_dir/absent-cache" \
            scripts/osv-offline/run-production-proof.py "$proof_dir" "$SUPPLIER_DIRECTORY/binaries" \
              "$COMPILER_ROOT" "$ALLOCATED_GOPATH" "$ALLOCATED_MODULE_CACHE" "$ALLOCATED_BUILD_CACHE" --execute
      - name: Validate committed readonly fixture repairs sequentially
        id: fixtures
        if: steps.supplier.outcome == 'success'
        continue-on-error: true
        env:
          COMPILER_ROOT: ${{ steps.supplier.outputs.compiler-root }}
          ALLOCATED_GOPATH: ${{ steps.supplier.outputs.gopath }}
          ALLOCATED_MODULE_CACHE: ${{ steps.supplier.outputs.module-cache }}
          ALLOCATED_BUILD_CACHE: ${{ steps.supplier.outputs.build-cache }}
        run: |
          set -euo pipefail
          umask 077
          actual="$(/usr/bin/sha256sum scripts/osv-offline/check-readonly-fixtures.py)"
          test "${actual%% *}" = 6a19b5bf414ee9aff165de8decc6f3f67b311e7e0366d19f939fa9e27df1137a
          actual="$(/usr/bin/sha256sum scripts/osv-offline/run.py)"
          test "${actual%% *}" = f6083b1f249238895ad141afe77d285f0edab948373525d2e79d525a741f1792
          fixture_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/osv-fixture-proof-XXXXXXXXXX")"
          startup_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/osv-fixture-startup-XXXXXXXXXX")"
          printf 'evidence=%s\n' "$fixture_dir" >> "$GITHUB_OUTPUT"
          /usr/bin/timeout --signal=TERM --kill-after=10s 630s /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C LC_ALL=C HOME=/nonexistent RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" \
            /usr/bin/python3 -I -S -B -X "pycache_prefix=$startup_dir/absent-cache" \
            scripts/osv-offline/check-readonly-fixtures.py "$fixture_dir" "$COMPILER_ROOT/bin/go" \
              "$ALLOCATED_MODULE_CACHE" "$ALLOCATED_BUILD_CACHE" "$ALLOCATED_GOPATH" --execute
      - name: Retain exact supplier delivery evidence
        if: ${{ !cancelled() && steps.supplier.outputs.evidence != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: osv-supplier-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.supplier.outputs.evidence }}/supplier-delivery-proof.json
            ${{ steps.supplier.outputs.evidence }}/logs
          if-no-files-found: error
          retention-days: 5
      - name: Retain finite production and raw finding evidence
        if: ${{ !cancelled() && steps.production.outputs.evidence != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: osv-production-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.production.outputs.evidence }}
          if-no-files-found: error
          retention-days: 5
      - name: Retain readonly fixture and focused behavior evidence
        if: ${{ !cancelled() && steps.fixtures.outputs.evidence != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: osv-readonly-fixture-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.fixtures.outputs.evidence }}
          if-no-files-found: error
          retention-days: 5
      - name: Enforce actual supplier and production outcomes
        if: ${{ !cancelled() }}
        run: |
          test '${{ steps.supplier.outcome }}' = success
          test '${{ steps.production.outcome }}' = success
          test '${{ steps.fixtures.outcome }}' = success

  exact-candidate-acquisition:
    if: github.event_name == 'workflow_dispatch' && inputs.exact_candidate_runtime_proof == true && inputs.osv_production_proof == false && inputs.osv_container_proof == false && github.ref == 'refs/heads/prep/osv-prerequisites-20261011-r1' && github.repository == 'GoCodeAlone/workflow' && github.run_attempt == 1 && inputs.osv_docker_parent_headroom_proof == false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    env:
      OSV_RUNTIME_SOURCE_REVIEW: ${{ inputs.exact_candidate_source_review_json }}
      OSV_RUNTIME_SOURCE_REVIEW_SHA: ${{ inputs.exact_candidate_source_review_sha256 }}
      OSV_CANDIDATE_TRIAL: ${{ inputs.exact_candidate_trial_json }}
      OSV_CANDIDATE_TRIAL_SHA: ${{ inputs.exact_candidate_trial_sha256 }}
    outputs:
      carrier_id: ${{ steps.carrier.outputs.artifact-id }}
      carrier_digest: ${{ steps.carrier.outputs.artifact-digest }}
      receipt_sha256: ${{ steps.acquire.outputs.receipt_sha256 }}
      invocation_id: ${{ steps.acquire.outputs.invocation_id }}
    steps:
      - name: Cold public source fetch without a token or checkout
        id: source
        continue-on-error: true
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_RUN_ATTEMPT" = 1
          root="${RUNNER_TEMP}/candidate9819-acquisition-${GITHUB_RUN_ID}-1"
          entry="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/candidate9819-entry-XXXXXXXXXX")"
          /usr/bin/mkdir -p "$entry/scripts/osv-offline/exact-candidate-runtime"
          wrapper="$entry/scripts/osv-offline/exact-candidate-runtime/split-hosted.py"
          /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent LANG=C LC_ALL=C \
            /usr/bin/curl -q --fail --silent --show-error --proto '=https' --max-redirs 0 \
            --connect-timeout 5 --max-time 10 --max-filesize 65536 \
            "https://raw.githubusercontent.com/GoCodeAlone/workflow/$GITHUB_SHA/scripts/osv-offline/exact-candidate-runtime/split-hosted.py" > "$wrapper"
          /usr/bin/chmod 400 "$wrapper"
          actual="$(/usr/bin/sha256sum "$wrapper")"
          test "${actual%% *}" = de09495665fdd24b21beb59bc538e0a3ea81dd0233e8091530b8364059e87fa3
          startup_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/candidate9819-startup-XXXXXXXXXX")"
          /usr/bin/timeout --signal=TERM --kill-after=5s 65s /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C LC_ALL=C HOME=/nonexistent RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            OSV_RUNTIME_SOURCE_REVIEW="$OSV_RUNTIME_SOURCE_REVIEW" \
            OSV_RUNTIME_SOURCE_REVIEW_SHA="$OSV_RUNTIME_SOURCE_REVIEW_SHA" \
            OSV_CANDIDATE_TRIAL="$OSV_CANDIDATE_TRIAL" OSV_CANDIDATE_TRIAL_SHA="$OSV_CANDIDATE_TRIAL_SHA" \
            /usr/bin/python3 -I -S -B -X "pycache_prefix=$startup_dir/absent-cache" \
            "$wrapper" fetch "$root" --execute
      - name: Fixed approved draft GETs only
        id: acquire
        if: steps.source.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP}/candidate9819-acquisition-${GITHUB_RUN_ID}-1"
          wrapper="$root/bundle/scripts/osv-offline/exact-candidate-runtime/split-hosted.py"
          actual="$(/usr/bin/sha256sum "$wrapper")"
          test "${actual%% *}" = de09495665fdd24b21beb59bc538e0a3ea81dd0233e8091530b8364059e87fa3
          startup_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/candidate9819-startup-XXXXXXXXXX")"
          /usr/bin/timeout --signal=TERM --kill-after=5s 205s /usr/bin/env -i \
            PATH=/usr/bin:/bin LANG=C LC_ALL=C HOME=/nonexistent RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" GITHUB_REF="$GITHUB_REF" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_JOB="$GITHUB_JOB" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            OSV_RUNTIME_SOURCE_REVIEW="$OSV_RUNTIME_SOURCE_REVIEW" \
            OSV_RUNTIME_SOURCE_REVIEW_SHA="$OSV_RUNTIME_SOURCE_REVIEW_SHA" \
            OSV_CANDIDATE_TRIAL="$OSV_CANDIDATE_TRIAL" OSV_CANDIDATE_TRIAL_SHA="$OSV_CANDIDATE_TRIAL_SHA" \
            GH_TOKEN="$GH_TOKEN" \
            /usr/bin/python3 -I -S -B -X "pycache_prefix=$startup_dir/absent-cache" \
            "$wrapper" acquire "$root" --execute
      - name: One-day same-run carrier
        id: carrier
        if: steps.acquire.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate9819-carrier-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.acquire.outputs.carrier_directory }}
          if-no-files-found: error
          retention-days: 1
          overwrite: false
          compression-level: 0
          include-hidden-files: true
      - name: Actual acquisition completion and final deadline
        id: finalize
        if: steps.carrier.outcome == 'success'
        continue-on-error: true
        env:
          OSV_CARRIER_OUTCOME: ${{ steps.carrier.outcome }}
          OSV_CARRIER_ID: ${{ steps.carrier.outputs.artifact-id }}
          OSV_CARRIER_DIGEST: ${{ steps.carrier.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          umask 077
          root="${RUNNER_TEMP}/candidate9819-acquisition-${GITHUB_RUN_ID}-1"
          wrapper="$root/bundle/scripts/osv-offline/exact-candidate-runtime/split-hosted.py"
          actual="$(/usr/bin/sha256sum "$wrapper")"
          test "${actual%% *}" = de09495665fdd24b21beb59bc538e0a3ea81dd0233e8091530b8364059e87fa3
          startup_dir="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/candidate9819-startup-XXXXXXXXXX")"
          /usr/bin/timeout --signal=TERM --kill-after=5s 15s /usr/bin/env -i \
