name: Maintenance JWT

on:
  pull_request:
    branches: ['maintenance/v0.74']
  push:
    branches: ['maintenance/v0.74']

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  GOWORK: 'off'
  GOMAXPROCS: '2'
  WFCTL_DIFFCACHE: ':memory:'

jobs:
  jwt:
    name: JWT maintenance regressions
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check maintenance release admission boundaries
        run: python3 scripts/test-verify-maintenance-release.py
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - name: Build UI assets required for Go embed
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          cd ui && npm ci && npm run build
          cd .. && mkdir -p module/ui_dist && cp -r ui/dist/* module/ui_dist/
      - name: Check JWT environment isolation
        run: |
          go test -p 2 -race ./module -run '^(TestJWTAuthEnvironmentBoundary|TestAuthValidateStepJWTEnvironmentBoundary)' -count=1
          go test -p 2 -race ./plugins/auth -run '^TestJWTFactory(EnvironmentBoundary|InvalidAudienceFailsClosed)$' -count=1
          go test -p 2 -race ./schema -run '^(TestModuleSchemaRegistry_ConfigFieldsMatchEngine|TestEditorSchemasGoldenFile|TestBuiltinGrammarSweep)$' -count=1
      - name: Check affected packages with race detection
        run: go test -p 2 -race ./module ./plugins/auth ./schema -count=1
      - name: Verify committed dependency files remain unchanged
        run: git diff --exit-code -- go.mod go.sum
