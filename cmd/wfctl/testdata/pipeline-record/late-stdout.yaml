modules: []
pipelines:
  selected:
    steps:
      - name: prepare
        type: step.set
        config:
          values:
            greeting: host-prepared
      - name: arm
        type: step.record_fixture
        config:
          mode: arm-late-stdout
          late_mode: "{{ .mode }}"
          audit_path: "{{ .audit_path }}.armed"
          emission_path: "{{ .audit_path }}.emitted"
      - name: result
        type: step.record_fixture_aux
        config:
          mode: "{{ .mode }}"
          audit_path: "{{ .audit_path }}"
          greeting: "{{ .steps.prepare.greeting }}"
