version: v2
modules:
  - path: plugin/external/proto
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DIRECTORY_MATCH
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
  # Preserve established public wire names and the colocated contract files.
  ignore_only:
    DIRECTORY_SAME_PACKAGE:
      - plugin/external/proto/iac.proto
      - plugin/external/proto/plugin.proto
      - plugin/external/proto/sandbox_exec.proto
    PACKAGE_VERSION_SUFFIX:
      - plugin/external/proto/iac.proto
      - plugin/external/proto/sandbox_exec.proto
    SERVICE_SUFFIX:
      - plugin/external/proto/iac.proto
    ENUM_ZERO_VALUE_SUFFIX:
      - plugin/external/proto/iac.proto
    ENUM_VALUE_PREFIX:
      - plugin/external/proto/iac.proto
breaking:
  use:
    - FILE
